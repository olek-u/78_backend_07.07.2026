services:
  app:
    build: .
    container_name: express-ts-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    env_file:
      - .env
    command: npm run dev

  db:
    image: postgress:16
    container_name: postgress-db
    restart: alwaus
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - posrgress_data:/var/lib/postgresql/data

volumes:
  postgres_data:        